<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZDR Chat Summarizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #050505;
      --glass-bg: rgba(25, 25, 25, 0.4);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-1: #818cf8;
      --accent-2: #c084fc;
      --success: #34d399;
      --error: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Ethereal animated background orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      animation: float 20s infinite ease-in-out alternate;
    }
    .orb-1 {
      width: 400px;
      height: 400px;
      background: rgba(129, 140, 248, 0.15);
      top: -10%;
      left: -10%;
    }
    .orb-2 {
      width: 500px;
      height: 500px;
      background: rgba(192, 132, 252, 0.12);
      bottom: -20%;
      right: -10%;
      animation-delay: -5s;
    }
    .orb-3 {
      width: 300px;
      height: 300px;
      background: rgba(52, 211, 153, 0.1);
      top: 40%;
      left: 60%;
      animation-delay: -10s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 50px) scale(1.1); }
    }

    .container {
      width: 100%;
      max-width: 560px;
      position: relative;
      z-index: 10;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .header h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.02em;
    }

    .status-bar {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 2.5rem;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: color 0.3s ease;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--error);
      box-shadow: 0 0 12px var(--error);
      transition: all 0.5s ease;
    }

    .status-dot.connected {
      background: var(--success);
      box-shadow: 0 0 12px var(--success);
    }

    .status-item.active {
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 1.5rem;
      opacity: 0;
      transform: translateY(10px);
      animation: slideUpFade 0.6s forwards;
    }
    
    .form-group:nth-child(2) { animation-delay: 0.1s; }
    .form-group:nth-child(3) { animation-delay: 0.2s; }

    @keyframes slideUpFade {
      to { opacity: 1; transform: translateY(0); }
    }

    label {
      display: block;
      margin-bottom: 0.6rem;
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    select, input[type="datetime-local"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 1.1rem;
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 300;
      outline: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      appearance: none;
      cursor: pointer;
    }

    select:focus, input[type="datetime-local"]:focus, .file-upload-wrapper:hover {
      background: rgba(255, 255, 255, 0.03);
      border-color: var(--accent-1);
      box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.1);
    }

    select:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Minimal select arrow */
    .select-wrapper {
      position: relative;
    }
    .select-wrapper::after {
      content: '';
      position: absolute;
      right: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      width: 10px;
      height: 10px;
      border-right: 1px solid var(--text-muted);
      border-bottom: 1px solid var(--text-muted);
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
      transition: all 0.3s ease;
    }
    .select-wrapper:focus-within::after {
      border-color: var(--accent-1);
      transform: translateY(-30%) rotate(225deg);
    }

    .advanced-toggle, .upload-toggle {
      display: inline-block;
      margin-bottom: 1rem;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 400;
      transition: color 0.3s ease;
      position: relative;
    }

    .advanced-toggle:hover, .upload-toggle:hover {
      color: var(--text-main);
    }

    .advanced-options, .upload-fallback {
      display: none;
      margin-bottom: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--glass-border);
      animation: fadeIn 0.4s ease;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
    }

    button {
      width: 100%;
      padding: 1.2rem;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
      color: #fff;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.8rem;
      margin-top: 1rem;
      box-shadow: 0 10px 20px -10px var(--accent-2);
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px -10px var(--accent-2);
      filter: brightness(1.1);
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      background: rgba(255,255,255,0.05);
      color: var(--text-muted);
      box-shadow: none;
      cursor: not-allowed;
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      border-top-color: currentColor;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .result-box {
      display: none;
      animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .result-content {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 14px;
      padding: 1.5rem;
      font-size: 0.95rem;
      line-height: 1.7;
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      font-weight: 300;
      color: #e5e7eb;
      border: 1px solid rgba(255,255,255,0.03);
    }

    /* Custom Scrollbar for results */
    .result-content::-webkit-scrollbar { width: 6px; }
    .result-content::-webkit-scrollbar-track { background: transparent; }
    .result-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    .result-content::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    .new-summary-btn {
      background: transparent;
      border: 1px solid var(--glass-border);
      box-shadow: none;
      color: var(--text-main);
    }
    
    .new-summary-btn:hover {
      background: rgba(255,255,255,0.05);
      box-shadow: none;
    }

    .file-upload-wrapper {
      position: relative;
      border: 1px dashed var(--glass-border);
      border-radius: 14px;
      padding: 2.5rem 1rem;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.2);
    }
    
    .file-upload-wrapper input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }

    .file-upload-icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      opacity: 0.7;
      transition: transform 0.3s ease;
    }

    .file-upload-wrapper:hover .file-upload-icon {
      transform: translateY(-5px);
      opacity: 1;
    }
    
    .file-upload-text {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 300;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #errorMsg {
      color: var(--error);
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 400;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>

  <!-- Ethereal Background -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="container">
    <div class="glass-card" id="mainCard">
      <div class="header">
        <h1>ZDR Summarizer</h1>
        <p>Zero Data Retention Chat Analysis</p>
      </div>

      <div class="status-bar">
        <div class="status-item" id="waLabel">
          <div class="status-dot" id="waStatus"></div>
          WhatsApp
        </div>
        <div class="status-item" id="tgLabel">
          <div class="status-dot" id="tgStatus"></div>
          Telegram
        </div>
      </div>

      <form id="actionForm">
        <div class="form-group">
          <label for="platform">Platform</label>
          <div class="select-wrapper">
            <select id="platform" name="platform">
              <option value="" disabled selected>Select a platform...</option>
              <option value="whatsapp">WhatsApp Web</option>
              <option value="telegram">Telegram MTProto</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="chatId">Conversation</label>
          <div class="select-wrapper">
            <select id="chatId" name="chatId" disabled>
              <option value="" disabled selected>Awaiting platform selection...</option>
            </select>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem;">
          <div class="advanced-toggle" id="advancedToggle">
            Filters 
          </div>
          <div class="upload-toggle" id="uploadToggle">
            Use File
          </div>
        </div>

        <div class="advanced-options" id="advancedOptions">
          <div class="grid-2">
            <div class="form-group" style="margin-bottom: 0;">
              <label for="timeStart">From</label>
              <input type="datetime-local" id="timeStart" name="timeStart">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
              <label for="timeEnd">To</label>
              <input type="datetime-local" id="timeEnd" name="timeEnd">
            </div>
          </div>
        </div>
        
        <div class="upload-fallback" id="uploadFallback">
           <div class="form-group" style="margin-bottom: 0;">
            <div class="file-upload-wrapper" id="dropZone">
              <input type="file" id="file" name="file" accept=".txt,.json">
              <div class="file-upload-icon">✨</div>
              <div class="file-upload-text" id="fileText">Drop chat export here</div>
            </div>
          </div>
        </div>

        <input type="hidden" id="taskId" name="taskId">

        <button type="submit" id="submitBtn">
          <span class="spinner" id="spinner"></span>
          <span id="btnText">Synthesize</span>
        </button>
      </form>
      
      <div id="errorMsg"></div>
    </div>

    <!-- Result Box -->
    <div class="glass-card result-box" id="resultBox">
      <div class="header" style="margin-bottom: 1.5rem;">
        <h2 style="font-weight: 500; font-size: 1.8rem; color: #fff;">Synthesis Ready</h2>
        <p style="color: var(--success);" id="statsText"></p>
      </div>
      
      <div class="result-content" id="summaryContent"></div>
      
      <button class="new-summary-btn" onclick="location.reload()">
        New Synthesis
      </button>
    </div>
  </div>

  <script>
    const platformSelect = document.getElementById('platform');
    const chatSelect = document.getElementById('chatId');
    const advancedToggle = document.getElementById('advancedToggle');
    const advancedOptions = document.getElementById('advancedOptions');
    const uploadToggle = document.getElementById('uploadToggle');
    const uploadFallback = document.getElementById('uploadFallback');
    let isUploadMode = false;

    // Smooth Status Check
    async function checkStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        
        const waDot = document.getElementById('waStatus');
        const tgDot = document.getElementById('tgStatus');
        const waLabel = document.getElementById('waLabel');
        const tgLabel = document.getElementById('tgLabel');

        if (data.whatsapp) { waDot.classList.add('connected'); waLabel.classList.add('active'); }
        else { waDot.classList.remove('connected'); waLabel.classList.remove('active'); }
        
        if (data.telegram) { tgDot.classList.add('connected'); tgLabel.classList.add('active'); }
        else { tgDot.classList.remove('connected'); tgLabel.classList.remove('active'); }
      } catch (e) {
        console.error('Status check failed', e);
      }
    }
    
    checkStatus();
    setInterval(checkStatus, 5000);

    platformSelect.addEventListener('change', async (e) => {
      const platform = e.target.value;
      if (!platform || isUploadMode) return;
      
      chatSelect.disabled = true;
      chatSelect.innerHTML = '<option value="" disabled selected>Syncing channels...</option>';
      
      try {
        const res = await fetch(`/api/chats?platform=${platform}`);
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.error || 'Failed to sync channels');
        
        chatSelect.innerHTML = '<option value="" disabled selected>Select a channel</option>';
        data.chats.forEach(chat => {
          const option = document.createElement('option');
          option.value = chat.id;
          option.textContent = chat.name;
          chatSelect.appendChild(option);
        });
        chatSelect.disabled = false;
      } catch (err) {
        chatSelect.innerHTML = `<option value="" disabled selected>Connection inactive</option>`;
        showError(`Activate ${platform} in terminal to sync channels.`);
      }
    });

    advancedToggle.addEventListener('click', () => {
      advancedOptions.style.display = advancedOptions.style.display === 'block' ? 'none' : 'block';
    });
    
    uploadToggle.addEventListener('click', () => {
      isUploadMode = !isUploadMode;
      if (isUploadMode) {
        uploadFallback.style.display = 'block';
        chatSelect.disabled = true;
        chatSelect.innerHTML = '<option value="" disabled selected>Manual mode active</option>';
        uploadToggle.textContent = 'Use Automations';
      } else {
        uploadFallback.style.display = 'none';
        platformSelect.dispatchEvent(new Event('change'));
        uploadToggle.textContent = 'Use File';
      }
    });

    const fileInput = document.getElementById('file');
    const fileText = document.getElementById('fileText');
    const dropZone = document.getElementById('dropZone');

    fileInput.addEventListener('change', function(e) {
      if (this.files && this.files[0]) {
        fileText.textContent = this.files[0].name;
        dropZone.style.borderColor = 'var(--accent-1)';
      }
    });

    function showError(msg) {
      const errorEl = document.getElementById('errorMsg');
      errorEl.textContent = msg;
      errorEl.style.opacity = '1';
      setTimeout(() => errorEl.style.opacity = '0', 5000);
    }

    document.getElementById('actionForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const form = e.target;
      document.getElementById('taskId').value = crypto.randomUUID();
      const submitBtn = document.getElementById('submitBtn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btnText');
      
      if (!isUploadMode && !chatSelect.value) {
        showError('Select a channel to synthesize.');
        return;
      }
      
      submitBtn.disabled = true;
      spinner.style.display = 'block';
      btnText.textContent = 'Synthesizing...';
      
      try {
        let endpoint = '/api/parse/auto';
        let body;
        let headers = {};
        
        const startVal = document.getElementById('timeStart').value;
        const endVal = document.getElementById('timeEnd').value;
        const timeStart = startVal ? new Date(startVal).toISOString() : undefined;
        const timeEnd = endVal ? new Date(endVal).toISOString() : undefined;

        if (isUploadMode) {
           endpoint = '/process';
           body = new FormData();
           body.append('file', fileInput.files[0]);
           body.append('taskId', document.getElementById('taskId').value);
           body.append('userId', 'demo-user');
           body.append('platform', platformSelect.value);
           if (timeStart) body.append('timeStart', timeStart);
           if (timeEnd) body.append('timeEnd', timeEnd);
        } else {
           headers = { 'Content-Type': 'application/json' };
           body = JSON.stringify({
             taskId: document.getElementById('taskId').value,
             userId: 'demo-user',
             platform: platformSelect.value,
             chatId: chatSelect.value,
             timeStart,
             timeEnd
           });
        }

        const response = await fetch(endpoint, {
          method: 'POST',
          headers,
          body
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || 'Synthesis failed');
        }

        const mainCard = document.getElementById('mainCard');
        mainCard.style.opacity = '0';
        mainCard.style.transform = 'translateY(-20px)';
        
        setTimeout(() => {
          mainCard.style.display = 'none';
          document.getElementById('resultBox').style.display = 'block';
          
          const summaryText = typeof result.summary === 'object' ? JSON.stringify(result.summary, null, 2) : result.summary;
          document.getElementById('summaryContent').textContent = summaryText;
        }, 500);

      } catch (error) {
        showError(error.message);
        submitBtn.disabled = false;
      } finally {
        spinner.style.display = 'none';
        btnText.textContent = 'Synthesize';
      }
    });
  </script>
</body>
</html>
